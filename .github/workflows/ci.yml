name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:assets
      - run: pnpm build
      - run: pnpm check:bundle
      - name: Build Docker image
        run: docker build --tag go-go-gorgeous:${{ github.sha }} .

  deploy:
    needs: quality
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: cloudflare-config
        name: Check Cloudflare deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions settings."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.cloudflare-config.outputs.configured == 'true'
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        if: steps.cloudflare-config.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cloudflare-config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build for Cloudflare Pages
        if: steps.cloudflare-config.outputs.configured == 'true'
        run: pnpm build
      - name: Remove model from Pages static assets
        if: steps.cloudflare-config.outputs.configured == 'true'
        run: rm dist/models/face-parsing-resnet18.onnx
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --config=wrangler.jsonc
          --project-name=go-go-gorgeous
          --branch=main
