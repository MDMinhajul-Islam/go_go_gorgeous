name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:assets
      - run: pnpm build
      - run: pnpm check:bundle
      - name: Build Docker image
        run: docker build --tag go-go-gorgeous:${{ github.sha }} .

  deploy:
    needs: quality
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for Cloudflare Pages
        run: pnpm build
      - name: Upload face model to R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put "go-go-gorgeous-models/models/face-parsing-resnet18.onnx" --file=public/models/face-parsing-resnet18.onnx --content-type=application/octet-stream --remote
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --config=wrangler.jsonc --project-name="go-go-gorgeous" --branch=main
